<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free Mail Forge</title>
    <meta name="description" content="@inbox.xtracker.co.kr 수신 메일 확인 앱" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <h1>메일 확인</h1>
        <p>@inbox.xtracker.co.kr 주소를 만들고 메일을 확인하세요.</p>
      </header>

      <section class="top-inbox-grid">
        <article class="card panel-tall">
          <h2>받은 메일 목록</h2>
          <div id="messageList" class="empty">주소를 적용하면 해당 주소로 온 메일이 표시됩니다.</div>
        </article>

        <article class="card panel-tall">
          <h2>계속 볼 주소 목록</h2>
          <div id="aliasList" class="empty">저장한 주소가 아직 없습니다.</div>
        </article>
      </section>

      <section class="card">
        <h2>주소 설정</h2>
        <label class="field">
          <span>메일명</span>
          <input id="localPartInput" type="text" placeholder="예: minako, support" maxlength="32" />
        </label>

        <p class="preview">
          <strong id="previewLocal">your-alias</strong><span id="previewDomain">@inbox.xtracker.co.kr</span>
        </p>

        <div class="actions">
          <button id="activateInboxBtn" type="button">주소 저장</button>
        </div>
      </section>

      <section class="card">
        <h2>현재 주소</h2>
        <p id="currentInbox" class="current-address">주소를 설정해보세요</p>
        <div class="status-line">
          <span id="connectionBadge" class="status-badge">준비 중</span>
          <span id="inboxHint">원하는 메일명을 입력해 주소를 저장하세요.</span>
        </div>
        <p id="statusText" class="status-text">앱을 초기화하는 중입니다.</p>
        <div class="stats-inline">
          <span>상태 <strong id="modeLabel">-</strong></span>
          <span>메일 <strong id="messageCount">0</strong></span>
          <span>저장 주소 <strong id="aliasCount">0</strong></span>
        </div>
        <p id="sessionCard" class="session-card">설정 확인 중</p>
      </section>

      <section class="card">
        <h2>메일 상세</h2>
        <div id="messageDetail" class="empty">메일을 클릭하면 내용이 표시됩니다.</div>
      </section>
    </main>

    <template id="messageItemTemplate">
      <button type="button" class="message-item">
        <div class="message-item__head">
          <strong class="message-item__subject"></strong>
          <span class="message-item__time"></span>
        </div>
        <span class="message-item__from"></span>
        <p class="message-item__intro"></p>
      </button>
    </template>

    <template id="aliasItemTemplate">
      <article class="alias-item">
        <div>
          <strong class="alias-item__address"></strong>
          <span class="alias-item__meta"></span>
        </div>
        <div class="alias-item__actions">
          <button type="button" class="alias-remove-btn">삭제</button>
        </div>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
